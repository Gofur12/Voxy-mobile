name: Fabric build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Run dependency-free verification
        run: ./scripts/verify-all.sh
      - name: Build and verify Fabric JAR
        run: gradle --no-daemon clean build
      - name: Upload remapped Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoxyMobileCore-stage29-fabric-1.20.1
          path: build/libs/VoxyMobileCore-0.1.0-stage29.jar
          if-no-files-found: error
          retention-days: 14
