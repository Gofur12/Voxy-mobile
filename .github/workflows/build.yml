
name: Voxy Mobile Fabric Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate project
        run: |
          java -version
          ./gradlew --version

      - name: Build Fabric mod
        run: ./gradlew --no-daemon clean build

      - name: Verify JAR exists
        run: |
          find build/libs -maxdepth 1 -name '*.jar' -type f
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxyMobile-Fabric-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
